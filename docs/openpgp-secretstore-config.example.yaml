# Example config for openpgp_secretstore (module and lookup).
# Copy to the platform-specific path (see README). All options can be
# overridden by environment variables with prefix ANSIBLE_OPENPGP_SECRETSTORE_.
# Env overrides config file.

# Backend: "gnupg" or "sop". Omit to auto-select (SOP if decryption key + execs set).
# Env: ANSIBLE_OPENPGP_SECRETSTORE_BACKEND
# backend: sop

# Optional default password store path (module/lookup can override per task).
# Env: ANSIBLE_OPENPGP_SECRETSTORE_PASSWORD_STORE_PATH
# password_store_path: ~/.password-store

sop:
  # Default SOP binary for both encrypt and decrypt if not overridden below.
  # Env: ANSIBLE_OPENPGP_SECRETSTORE_SOP_EXEC
  exec: rsop

  encryption:
    # Binary used for encrypt. Falls back to sop.exec if unset.
    # Env: ANSIBLE_OPENPGP_SECRETSTORE_SOP_ENCRYPTION_EXEC
    exec: rsop
    # Certificate store (PGP cert-d layout). Used to resolve recipient fingerprints to cert files.
    # Env: PGP_CERT_D or ANSIBLE_OPENPGP_SECRETSTORE_SOP_ENCRYPTION_PGP_CERT_D
    pgp_cert_d: ~/.local/share/pgp.cert.d

  decryption:
    # Binary used for decrypt (e.g. rsoct for hardware-backed).
    # Env: ANSIBLE_OPENPGP_SECRETSTORE_SOP_DECRYPTION_EXEC
    exec: rsop
    # Path to secret key file (required for SOP backend).
    # Env: ANSIBLE_OPENPGP_SECRETSTORE_SOP_DECRYPTION_KEY
    key: ~/.config/ansible-openpgp-secretstore/secret-key.asc
    # Passphrase for the key (optional). Note: passed as --with-key-password to the SOP
    # executable and may be visible in process listings (e.g. ps).
    # Env: ANSIBLE_OPENPGP_SECRETSTORE_SOP_DECRYPTION_PASSWORD
    # password: ""
