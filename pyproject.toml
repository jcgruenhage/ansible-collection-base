[project]
name = "ansible-collection-base"
version = "0.2.0"
description = "Ansible collection famedly.base"
readme = "README.md"
# 3.12 for controller, targets support >=3.9.0 still
requires-python = ">=3.12.0,<3.15.0"

dependencies = [
    "GitPython>=3.1.24",
    "PyYAML>=6.0",
    "ansible-core>=2.17.0,<2.21.0",
    "dataclass-wizard[yaml]>=0.39.1",
    "filelock>=3.0.12",
    "gitpython>=3.1.46",
    "pgpy13>=0.6.1rc1",
    "python-gnupg>=0.4.8",
    "pyyaml>=6.0.3",
]

# The GnuPG secretstore needs some work before it can pass ruff lints.
[tool.ruff]
extend-exclude = [
    "plugins/module_utils/gpg_utils.py",
    "plugins/lookup/gpg_secretstore.py",
    "plugins/modules/gpg_secretstore.py",
    "tests/unit/mock_filelock.py",
    "tests/unit/mock_secretstore.py",
    "tests/unit/test_gpg_secretstore.py",
    "tests/unit/utils.py",
]

# Ansible modules and lookup plugins must have DOCUMENTATION/EXAMPLES/RETURN
# (and often ANSIBLE_METADATA) before the real imports, so imports are not
# at the top of the file. module_utils sometimes uses late/optional imports.
[tool.ruff.lint.per-file-ignores]
"plugins/modules/*.py" = ["E402"]
"plugins/lookup/*.py" = ["E402"]
"plugins/module_utils/**/*.py" = ["E402"]

[tool.ty.environment]
# Ansible collections must live under ansible_collections/<namespace>/<name>/,
# so ../../.. reaches the directory that contains the ansible_collections tree.
extra-paths = ["../../.."]

# The GnuPG secretstore needs some work before it can pass type checking. The 
[tool.ty.src]
exclude = [
    # The GnuPG secretstore needs some work before it can pass type checking. The 
    "plugins/module_utils/gpg_utils.py",
    "plugins/lookup/gpg_secretstore.py",
    "plugins/modules/gpg_secretstore.py",
    "tests/unit/mock_filelock.py",
    "tests/unit/mock_secretstore.py",
    "tests/unit/test_gpg_secretstore.py",
    "tests/unit/utils.py",
]

[dependency-groups]
dev = [
    "ansible>=13.3.0",
    "ansible-lint>=26.1.1",
    "pylint>=4.0.4",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]
